name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLASK_DEBUG: "true"
      ADMIN_TOKEN: ci-test-token
      DATABASE_URL: sqlite:///:memory:
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run Python compile check
        run: python -m compileall -q app.py routing tests
